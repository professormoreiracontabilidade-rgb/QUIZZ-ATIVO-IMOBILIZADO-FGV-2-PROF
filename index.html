<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Professor Moreira — Imobilizado — Quiz 2 — professor</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#f5f7fc;color:#142443}body{display:flex;flex-direction:column}header{background:#17295c;color:white;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}header strong{font-size:19px}.tag{background:#e8e9ff;color:#273b83;border-radius:30px;padding:6px 12px;font-weight:800}main{flex:1;position:relative;min-height:65vh;display:flex;flex-direction:column;padding:18px 25px 105px}.sheet{background:white;border:2px solid #d9dff0;border-top:8px solid #6854c5;border-radius:15px;box-shadow:0 8px 30px #14244313;padding:clamp(18px,3vw,36px);width:100%;min-height:65vh;position:relative}.intro{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:65vh}.intro h1{font-size:clamp(29px,4.5vw,58px);line-height:1.15;margin:8px}.intro h2{font-size:clamp(25px,3.5vw,44px);color:#4837a6}.intro p{font-size:24px}.questionTitle{font-size:clamp(19px,2.3vw,29px);color:#4633a5;margin:0 0 12px}.source{font-size:16px;color:#526180;margin-bottom:18px}.statement{font-size:clamp(19px,2vw,28px);line-height:1.5;font-weight:650;white-space:pre-wrap}.option{font-size:clamp(18px,1.7vw,24px);padding:12px 16px;margin:10px 0;border:2px solid #d9dff0;border-radius:10px;line-height:1.35;background:#fff;text-align:left;width:100%;color:inherit}.option.selected{border-color:#6652d0;background:#eeeaff}.option.correct{border-color:#198f52;background:#e6f7ec}.option.wrong{border-color:#c52f3b;background:#ffeaed}.answer{font-size:clamp(19px,1.8vw,25px);line-height:1.65;white-space:pre-wrap;color:#a8182d}.answerKey{font-size:clamp(24px,2.6vw,34px);color:#17824c;font-weight:900;margin-bottom:20px}footer{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:#17295c;padding:12px 18px;z-index:9}button{cursor:pointer;border:0;border-radius:10px;background:#eeeaff;color:#2d236d;padding:12px 17px;font-size:16px;font-weight:800}button:disabled{opacity:.4;cursor:default}.primary{background:#6d57d4;color:white}.green{background:#17864a;color:white}.red{background:#b52a39;color:white}.tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:#e9eaf9;padding:8px;border-radius:10px;margin-bottom:12px}.tools button{padding:8px 11px}.tools button.active{outline:3px solid #29296c}.tools label{font-weight:bold}.tools input{vertical-align:middle}#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:3;cursor:crosshair;pointer-events:none}.teacher .sheet{min-height:75vh}.teacher main{padding:12px 12px 120px}.teacher .statement{font-size:clamp(21px,2.1vw,30px)}.counter{color:white;font-weight:bold}.score{font-size:clamp(23px,3vw,35px);text-align:center;line-height:1.7} .note{color:#57617d;font-size:15px} @media(max-width:650px){main{padding:9px 9px 125px}.sheet{padding:17px}.option{font-size:18px}footer{justify-content:center;padding:8px}footer button{padding:10px;font-size:14px}header strong{font-size:15px}}</style></head><body class="teacher"><header><strong>CURSO DE CONTABILIDADE • PROFESSOR MOREIRA</strong><span class="tag">FGV | CPC 27 | QUIZ 2 | PROFESSOR</span></header><main><div id="tools" class="tools"><button id="penToggle" onclick="setTool(tool==='off'?'pen':'off')">DESATIVAR CANETA</button><button onclick="setTool('pen')">CANETA</button><button onclick="setTool('highlighter')">MARCA-TEXTO</button><button onclick="setTool('erase')">BORRACHA</button><button onclick="setColor('#e02d32')" style="background:#e02d32;color:white">VERMELHA</button><button onclick="setColor('#1a65d1')" style="background:#1a65d1;color:white">AZUL</button><button onclick="setColor('#161616')" style="background:#161616;color:white">PRETA</button><button onclick="setColor('#18824b')" style="background:#18824b;color:white">VERDE</button><button onclick="color='#f2d01e';setTool('highlighter')" style="background:#f2d01e">AMARELO</button><label>Espessura <input type="range" min="1" max="14" value="3" oninput="size=+this.value"></label><button onclick="clearBoard()">LIMPAR LOUSA</button></div><section class="sheet"><div id="content"></div></section></main><footer><button onclick="prev()" id="prev">← VOLTAR</button><button class="green" onclick="teacherSignal(true)">✓ ACERTOU</button><button class="red" onclick="teacherSignal(false)">✗ ERROU</button><span id="counter" class="counter"></span><button onclick="restart()">↻ REINICIAR</button><button class="primary" onclick="next()" id="next">SEGUIR →</button></footer><script>const Q=[{"n": 11, "source": "FGV - ATM (Pref SJC)/Pref SJC/Gestão Tributária/2024", "statement": "Em uma sociedade empresária, são classificados(as) como “Ativo Imobilizado em Andamento”", "options": [["A", "os melhoramentos e as obras integradas aos terrenos utilizados."], ["B", "os bens incorpóreos destinados à manutenção das atividades."], ["C", "as peças destinadas à substituição em máquinas e equipamentos."], ["D", "os bens utilizados para deslocamento de pessoal ou transporte de mercadorias."], ["E", "os bens em uso durante a fase pré-operacional, relativos ao desenvolvimento de um projeto."]], "answer": "E", "explanation": "Imobilizado em andamento reúne ativos corpóreos ainda em construção, instalação ou preparação para uso. Entre as opções, bens em uso na fase pré-operacional relativos ao desenvolvimento de projeto podem integrar a rubrica conforme a classificação cobrada pela banca, alternativa E. Atenção: a classificação depende da natureza e do estágio de cada bem; ativo já pronto para uso normalmente é apresentado na classe correspondente de imobilizado em operação, não automaticamente como “em andamento”."}, {"n": 12, "source": "FGV - Cons Leg (CM SP)/CM SP/Contador/2024", "statement": "Um restaurante adquiriu, por R$50.000, grades que foram instaladas ao redor de seu terreno por razão de segurança. A aquisição das grades não aumentou diretamente os benefícios econômicos futuros específicos do terreno, no entanto, foi considerada necessária para que o fluxo do atendimento aos clientes continuasse. Assinale a opção que indica a classificação contábil das grades nas demonstrações contábeis do restaurante, de acordo com as diretrizes dos pronunciamentos contábeis.", "options": [["A", "Ativo Imobilizado, no Balanço Patrimonial."], ["B", "Investimentos, no Balanço Patrimonial."], ["C", "Ativo Realizável a Longo Prazo, no Balanço Patrimonial."], ["D", "Despesa Operacional, na Demonstração do Resultado do Exercício."], ["E", "Outras Despesas Operacionais, na Demonstração do Resultado do Exercício."]], "answer": "A", "explanation": "O CPC 27, item 11, admite reconhecer bens adquiridos por razões de segurança ou ambientais, mesmo sem aumento direto dos benefícios econômicos de um item isolado, se permitirem obter benefícios de outros ativos. As grades são corpóreas, usadas continuamente para proteger o restaurante e permitir o atendimento. Logo, R$ 50.000 são registrados no ativo imobilizado, sujeitos à depreciação quando aplicável. Alternativa A."}, {"n": 13, "source": "FGV - AL (CAM DEP)/CAM DEP/Consultor Legislativo/Área III/2024", "statement": "Em 01/01/2024, uma sociedade empresária adquiriu uma máquina-ferramenta controlada por computador por R$50.000. A máquina só funciona quando controlada por um* software* específico que foi adquirido conjuntamente por R$20.000. O frete para a entrega da máquina ferramenta foi de R$2.000. Assinale a opção que indica o reconhecimento contábil dos gastos no ativo da sociedade empresária.", "options": [["A", "intangível: R$70.000."], ["B", "intangível: R$72.000."], ["C", "imobilizado: R$72.000."], ["D", "imobilizado: R$50.000 e intangível: R$20.000."], ["E", "imobilizado: R$52.000 e intangível: R$20.000."]], "answer": "C", "explanation": "O CPC 04 explica que software indispensável ao funcionamento de equipamento específico é tratado como parte integrante do hardware, e não como intangível separado. Máquina R$ 50.000 + software inseparável R$ 20.000 + frete R$ 2.000 = R$ 72.000 no imobilizado. A separação entre imobilizado e intangível seria pertinente se o software tivesse autonomia funcional. Alternativa C."}, {"n": 14, "source": "FGV - AL (CAM DEP)/CAM DEP/Consultor Legislativo/Área III/2024", "statement": "Em relação às normas de contabilidade, brasileiras e internacionais, analise as afirmações a seguir: I. Elaboração e apresentação da Demonstração do Valor Adicionado pelas companhias abertas como parte integrante das demonstrações contábeis, divulgadas ao final de cada exercício social. II. Proibição da apresentação de item de ativo imoblizado pelo valor reavaliado, que correspondente ao seu valor justo à data da reavaliação menos qualquer depreciação e perda por redução ao valor recuperável acumuladas subsequentes. III. Encorajamento para que a despesa de depreciação dos ativos imobilizados seja calculada com base nas taxas utilizadas pela contabilidade tributária. Apresenta(m) diferença(s) entre as normas de contabilidade brasileiras e internacionais, o que se apresenta em", "options": [["A", "I, apenas."], ["B", "II, apenas."], ["C", "I e II, apenas."], ["D", "II e III, apenas."], ["E", "I, II e III."]], "answer": "C", "explanation": "Afirmação I: a DVA é obrigatória para companhias abertas no Brasil, diferentemente da exigência geral das IFRS — verdadeira. II: a legislação brasileira não permite reavaliação espontânea de imobilizado, enquanto o IAS 16 admite modelo de reavaliação — verdadeira. III: normas contábeis não recomendam usar automaticamente taxas fiscais; depreciação deve refletir vida útil econômica e padrão de consumo — falsa. Portanto, somente I e II. Alternativa C."}, {"n": 15, "source": "FGV - AJ (TJ AP)/TJ AP/Apoio Especializado/Contador/2024", "statement": "Uma indústria S/A construiu uma plataforma de petróleo na costa norte e apresentou os seguintes gastos. | Descrição | Valor | | -------------------------------------------------------------------- | ------------- | | Preparação do local | R$ 10 milhões | | Frete para recebimento das peças da instalação | R$ 3 milhões | | Instalação e montagem da plataforma | R$ 40 milhões | | Transferência das atividades para novo local (incluindo treinamento) | R$ 2 milhões | | Testes para verificação do funcionamento da plataforma | R$ 1 milhão | | Estimativa de desmontagem e remoção da plataforma | R$ 8 milhões | Considere o valor presente de R$ 4 milhões para a estimativa de desmontagem e remoção da plataforma. A partir das informações apresentadas, o custo do ativo imobilizado da plataforma será de:", "options": [["A", "R$ 55 milhões;"], ["B", "R$ 58 milhões;"], ["C", "R$ 64 milhões;"], ["D", "R$ 66 milhões;"], ["E", "R$ 70 milhões."]], "answer": "B", "explanation": "Custos capitalizáveis pelo CPC 27: preparação R$ 10 milhões + frete R$ 3 milhões + instalação/montagem R$ 40 milhões + testes R$ 1 milhão + valor presente da desmontagem R$ 4 milhões = R$ 58 milhões. Gastos de transferência de atividades e treinamento (R$ 2 milhões) não integram o custo. A obrigação futura entra pelo valor presente informado, e não pelo valor nominal de R$ 8 milhões. Alternativa B."}, {"n": 16, "source": "FGV - AJ (TJ AP)/TJ AP/Apoio Especializado/Contador/2024", "statement": "Uma empresa S/A construiu uma nova arena para a realização de shows na região Norte do país. Em vista de regulamentações de segurança, a autorização de funcionamento definitiva somente é aprovada após eventos testes com capacidade reduzida. A capacidade total da arena é de 3 mil pessoas em pé e 500 sentadas. O evento teste contou com 200 pessoas sentadas e 800 em pé. Considerando-se as informações apresentadas, as eventuais receitas do evento, se relevantes, devem ser:", "options": [["A", "deduzidas do patrimônio líquido;"], ["B", "contabilizadas como receitas diferidas;"], ["C", "contabilizadas como receitas do período;"], ["D", "contabilizadas como receitas não operacionais;"], ["E", "deduzidas do valor total de construção da arena."]], "answer": "E", "explanation": "O CPC 27 (alterado) prevê que valores obtidos com a venda de itens produzidos enquanto o ativo é preparado para o uso pretendido não sejam abatidos do custo do imobilizado; receitas e respectivos custos são reconhecidos no resultado conforme as normas aplicáveis. Portanto, a receita relevante do evento-teste é receita do período (alternativa C). O gabarito E do anexo parece adotar tratamento anterior à alteração do CPC 27. É necessário conferir o gabarito definitivo e eventual recurso/retificação da banca."}, {"n": 17, "source": "FGV - Tec Leg (ALEP)/ALEP/Técnico em Contabilidade/2024", "statement": "Em 01/01/2024, uma sociedade empresária que prestava serviços de auditoria contábil adquiriu, a prazo, computadores para serem utilizados por seus funcionários por R$50.000. A vida útil era estimada em cinco anos e os ativos imobilizados da sociedade empresária são depreciados pelo método linear. Na data, a sociedade empresária pagou antecipadamente R$10.000, que corresponde à manutenção periódica dos computadores e será feita anualmente, durante toda a vida útil. Assinale a opção que indica o impacto da transação no ativo da sociedade empresária em 01/01/2024, de acordo com a NBC TG 27 (R4) – Ativo Imobilizado.", "options": [["A", "Ativo Imobilizado: R$60.000."], ["B", "Ativo Imobilizado: R$58.000; Ativo Circulante: R$2.000."], ["C", "Ativo Imobilizado: R$50.000; Ativo Circulante: R$10.000."], ["D", "Ativo Imobilizado: R$50.000; Ativo Realizável a Longo Prazo: R$10.000."], ["E", "Ativo Imobilizado: R$50.000; Ativo Realizável a Longo Prazo: R$8.000; Ativo Circulante: R$2.000."]], "answer": "E", "explanation": "Os computadores custam R$ 50.000 e são imobilizado. A manutenção periódica futura, paga antecipadamente, não integra o custo dos computadores: é despesa antecipada de R$ 10.000 a apropriar durante cinco anos. Parcela do primeiro ano = 10.000/5 = R$ 2.000 no ativo circulante; parcela dos quatro anos seguintes = R$ 8.000 no realizável a longo prazo. Resultado: imobilizado 50.000; AC 2.000; RLP 8.000. Alternativa E."}, {"n": 18, "source": "FGV - Tec Leg (ALEP)/ALEP/Técnico em Contabilidade/2024", "statement": "Em 02/01/2023, uma sociedade empresária apresentava o seguinte balanço patrimonial: | Ativo Imobilizado<br>Terreno | 80.000<br>80.000 | Patrimônio Líquido | 80.000 | | ---------------------------- | ---------------- | ------------------ | ------ | | Ativo Total | 80.000 | Passivo + PL | 80.000 | Em 31/12/2023 foi constatado que o valor justo do terreno era de R$100.000, uma vez que a área em que estava localizado tinha se valorizado. Na data, se o terreno fosse vendido, os gastos necessários para efetivar a compra, como honorário de advogados e impostos, eram estimados em R$8.000. Assinale a opção que indica o valor do terreno apresentado no balanço patrimonial da sociedade empresária em 31/12/2023.", "options": [["A", "R$80.000."], ["B", "R$88.000."], ["C", "R$92.000."], ["D", "R$100.000."], ["E", "R$108.000."]], "answer": "A", "explanation": "No modelo do custo adotado no Brasil, terreno não é automaticamente reavaliado quando seu preço de mercado sobe. O valor justo de R$ 100.000 e os gastos estimados de venda de R$ 8.000 não geram novo custo contábil. Sem indicação de perda por redução ao valor recuperável, o terreno continua por R$ 80.000. Terrenos normalmente não sofrem depreciação. Alternativa A."}, {"n": 19, "source": "FGV - Ana Leg (ALETO)/ALETO/Ciências Contábeis/2024", "statement": "A Cia. Alfa assinou um contrato de aluguel de dois anos de uma van para realizar o transporte de seus funcionários diariamente. A vida útil da van é estimada em cinco anos. Logo após a assinatura do contrato, a van foi pintada, para ficar com as mesmas cores do logo da sociedade empresária, e recebeu novos bancos, para oferecer mais conforto aos funcionários. A pintura e os bancos novos custaram, respectivamente, R$400 e R$10.000. Em relação à pintura e à troca dos bancos, a sociedade empresária deve contabilizar, anualmente, despesa de amortizações, depreciações e exaustões de", "options": [["A", "R$80."], ["B", "R$2.000."], ["C", "R$2.080."], ["D", "R$5.000."], ["E", "R$5.200."]], "answer": "D", "explanation": "A questão pressupõe que a pintura de R$ 400 seja gasto do período e que os bancos de R$ 10.000 constituam melhoria amortizável/depreciável no prazo do contrato de locação, de dois anos. Quota anual dos bancos = 10.000/2 = R$ 5.000. A vida útil de cinco anos da van pertence ao bem do arrendador e não é o prazo utilizado para essa melhoria contratual. Alternativa D. Observação: a contabilização precisa da pintura e das melhorias pode depender de detalhes não fornecidos."}, {"n": 20, "source": "FGV - Cont (Pref Caraguatatuba)/Pref Caraguatatuba/2024", "statement": "No balanço patrimonial, os ativos não circulantes são classificados como realizável a longo prazo, investimentos, imobilizado e intangível. Assinale a opção que indica uma diferença específica entre direitos classificados como ativo imobilizado e intangível.", "options": [["A", "Os imobilizados têm vida útil definida enquanto os intangíveis, vida útil indefinida."], ["B", "Os imobilizados são passíveis de depreciação enquanto os intangíveis, de exaustão."], ["C", "Os imobilizados tem por objeto bens corpóreos enquanto os intangíveis, bens incorpóreos."], ["D", "Os imobilizados são destinados à manutenção da entidade enquanto os intangíveis, não são."], ["E", "Os imobilizados podem ser reduzidos por perda de recuperabilidade, enquanto os intangíveis, não podem."]], "answer": "C", "explanation": "A diferença central é a substância física: imobilizado corresponde a itens tangíveis (máquinas, móveis, veículos); intangível corresponde a ativos identificáveis sem substância física (por exemplo, software independente). Ambos podem ter vida útil definida ou indefinida conforme a natureza; ambos podem sofrer impairment. A depreciação e a amortização seguem critérios próprios. Alternativa C."}];const MODE='professor';const GROUP=2;let index=-1,side=0,choices={},marks={},tool='pen',color='#e02d32',size=3;const key='moreira-cpc27-'+MODE+'-'+GROUP;try{const old=JSON.parse(localStorage.getItem(key)||'{}');choices=old.choices||{};marks=old.marks||{}}catch(e){}const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(key,JSON.stringify({choices,marks}))}catch(e){}}function intro(){return `<div class="intro"><h1>CURSO DE CONTABILIDADE<br>PROFESSOR MOREIRA</h1><h1>=================</h1><h2>SÓ QUESTÕES DA FGV</h2><h2>ATIVO IMOBILIZADO — CPC 27</h2><p>QUIZ ${GROUP} • QUESTÕES ${Q[0].n} A ${Q[9].n}</p><button class="primary" onclick="next()">COMEÇAR</button></div>`}function qhtml(q){return `<h2 class="questionTitle">QUESTÃO ${String(q.n).padStart(2,'0')} — FGV</h2><div class="source">${esc(q.source)}</div><div class="statement">${esc(q.statement)}</div><div class="options">${q.options.map(o=>`<button class="option ${choices[q.n]===o[0]?'selected':''}" onclick="choose('${o[0]}')" ${MODE==='professor'?'disabled':''}><b>${o[0]})</b> ${esc(o[1])}</button>`).join('')}</div>`}function ahtml(q){let o=q.options.find(x=>x[0]===q.answer);return `<h2 class="questionTitle">RESOLUÇÃO DA QUESTÃO ${String(q.n).padStart(2,'0')}</h2><div class="answerKey">GABARITO: LETRA ${q.answer} — ${esc(o?o[1]:'')}</div><div class="answer">${esc(q.explanation)}</div>`}function score(){let correct=Q.filter(q=>choices[q.n]===q.answer).length,wrong=Q.filter(q=>choices[q.n]&&choices[q.n]!==q.answer).length,blank=10-correct-wrong;return `<div class="intro score"><h2>RESULTADO DO QUIZ ${GROUP}</h2><div>Acertos: ${correct} / 10<br>Erros: ${wrong}<br>Sem resposta: ${blank}<br>Aproveitamento: ${correct*10}%</div><button class="primary" onclick="restart()">REINICIAR</button></div>`}function render(){const introPage=index===-1,finished=index===Q.length;$('#content').innerHTML=introPage?intro():finished?score():side===0?qhtml(Q[index]):ahtml(Q[index]);$('#counter').textContent=introPage?'Tela inicial':finished?'Resultado':`Questão ${index+1}/10 • ${side?'RESPOSTA':'PERGUNTA'}`;$('#prev').disabled=introPage;$('#next').textContent=finished?'INÍCIO':'SEGUIR →';if(MODE==='professor'){const tools=$('#tools');tools.style.display=(introPage||finished)?'none':'flex';const sheet=$('.sheet');let board=document.createElement('canvas');board.id='board';sheet.appendChild(board);initCanvas(board);$('#penToggle').textContent=tool==='off'?'ATIVAR CANETA':'DESATIVAR CANETA';} }function choose(v){if(index<0||index>=10||side||MODE!=='aluno')return;choices[Q[index].n]=v;save();render()}function next(){if(index===10){index=-1;side=0}else if(index===-1){index=0;side=0}else if(side===0){side=1}else if(index===9){index=10;side=0}else{index++;side=0}render()}function prev(){if(index===10){index=9;side=1}else if(index===-1)return;else if(side===1)side=0;else if(index===0)index=-1;else{index--;side=1}render()}function restart(){if(confirm('Reiniciar este quiz e apagar respostas e anotações?')){choices={};marks={};save();index=-1;side=0;render()}}function flash(ok){const sh=$('.sheet');sh.style.boxShadow=ok?'0 0 0 9px #31b46d':'0 0 0 9px #f35d68';setTimeout(()=>sh.style.boxShadow='',450)}function teacherSignal(ok){flash(ok)}function setTool(t){tool=t;render()}function setColor(c){color=c;tool='pen';render()}function initCanvas(c){let rect=c.parentElement.getBoundingClientRect();c.width=Math.max(1,Math.round(rect.width*devicePixelRatio));c.height=Math.max(1,Math.round(rect.height*devicePixelRatio));let ctx=c.getContext('2d');ctx.scale(devicePixelRatio,devicePixelRatio);let w=rect.width,h=rect.height;let k=index+'-'+side;let strokes=marks[k]||[];function paint(st){if(!st.points.length)return;ctx.strokeStyle=st.color;ctx.lineWidth=st.width;ctx.globalAlpha=st.alpha||1;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();st.points.forEach((p,i)=>{let x=p[0]*w,y=p[1]*h;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});if(st.points.length===1){let p=st.points[0];ctx.lineTo(p[0]*w+.1,p[1]*h+.1)}ctx.stroke();ctx.globalAlpha=1}strokes.forEach(paint);c.style.pointerEvents=tool==='off'?'none':'auto';c.style.cursor=tool==='erase'?'cell':'url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cg%20transform%3D%22rotate%280%2016%2016%29%22%3E%3Cpath%20d%3D%22M5%2027%20L9%2017%20L22%204%20Q24%202%2027%205%20L29%207%20Q30%209%2028%2011%20L15%2024%20Z%22%20fill%3D%22%23f8f8fc%22%20stroke%3D%22%2317295c%22%20stroke-width%3D%221.6%22%2F%3E%3Cpath%20d%3D%22M9%2017%20L15%2024%20M22%204%20L28%2011%22%20stroke%3D%22%2317295c%22%20stroke-width%3D%221.5%22%2F%3E%3Cpath%20d%3D%22M5%2027%20L11%2024%22%20stroke%3D%22%2317295c%22%20stroke-width%3D%221.3%22%2F%3E%3Ccircle%20cx%3D%225%22%20cy%3D%2227%22%20r%3D%221.5%22%20fill%3D%22%23d62c3c%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") 5 27, crosshair';let active=null;c.onpointerdown=e=>{if(tool==='off')return;e.preventDefault();c.setPointerCapture(e.pointerId);let p=point(e);active={color:tool==='erase'?'#ffffff':color,width:tool==='erase'?25:tool==='highlighter'?22:size,alpha:tool==='highlighter'?.32:1,points:[p]};strokes.push(active);marks[k]=strokes;paint(active)};c.onpointermove=e=>{if(!active)return;e.preventDefault();active.points.push(point(e));ctx.clearRect(0,0,w,h);strokes.forEach(paint)};c.onpointerup=()=>{active=null;save()};c.onpointercancel=()=>{active=null;save()};function point(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}}function clearBoard(){if(index<0||index>=10)return;delete marks[index+'-'+side];save();render()}window.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev()});render();</script></body></html>
